<div class="container mt-4" style="max-width:720px">
  <div class="card p-4">
    <h4 class="mb-3">{{ id ? 'Edit' : 'Add' }} Student</h4>
    <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
    <form (ngSubmit)="submit()">
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Name</label>
          <input class="form-control" [(ngModel)]="model.name" name="name" required />
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" [(ngModel)]="model.email" name="email" required />
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Class / Section</label>
        <input class="form-control" [(ngModel)]="model.classId" name="classId" />
      </div>
      <div class="mb-3">
        <label class="form-label">Phone</label>
        <input class="form-control" [(ngModel)]="model.phone" name="phone" />
      </div>
      <div class="mb-3">
        <label class="form-label">Address</label>
        <textarea class="form-control" [(ngModel)]="model.address" name="address"></textarea>
      </div>
      <div class="mb-3">
        <label class="form-label">Photo</label>
        <input type="file" class="form-control" (change)="onFileChange($event)" />
        <div *ngIf="model.photoUrl" class="mt-2">
          <img [src]="model.photoUrl" alt="photo" style="max-width:120px;" />
        </div>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-primary" [disabled]="loading">Save</button>
        <a class="btn btn-secondary" [routerLink]="['/students']">Cancel</a>
      </div>
    </form>
  </div>
</div>
