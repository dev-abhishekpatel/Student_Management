<div class="login-wrapper d-flex align-items-center justify-content-center min-vh-100 p-3 p-md-4">
  <div class="login-card card border-0 shadow-lg rounded-4 overflow-hidden" style="max-width: 440px; width: 100%;">

    <!-- Header Banner -->
    <div class="card-header border-0 text-white text-center p-4 bg-primary bg-gradient position-relative">
      <div class="brand-badge d-inline-flex align-items-center justify-content-center bg-white bg-opacity-20 text-white rounded-circle mb-2 p-3" style="width: 64px; height: 64px;">
        <i class="bi bi-shield-lock-fill fs-1 text-light"></i>
      </div>
      <h3 class="fw-bold mb-1">St. Xavier Academy</h3>
      <p class="text-white-50 small mb-0 font-monospace text-uppercase">
        Student & Portal Sign In
      </p>
    </div>

    <div class="card-body p-4 bg-white">
      @if (error) {
        <div class="alert alert-danger border-0 d-flex align-items-center small mb-4 rounded-3 p-3 shadow-xs">
          <i class="bi bi-exclamation-triangle-fill fs-4 me-2 flex-shrink-0 text-danger"></i>
          <div>{{ error }}</div>
        </div>
      }

      <form (ngSubmit)="submit()" class="mb-3">
        <!-- Email Input -->
        <div class="mb-3">
          <label class="form-label text-muted extra-small fw-bold text-uppercase mb-1">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope-fill"></i></span>
            <input type="email" class="form-control bg-light border-start-0 ps-0 py-2.5 shadow-none" 
                   [(ngModel)]="email" name="email" 
                   placeholder="e.g. admin@school.com" required />
          </div>
        </div>

        <!-- Password Input -->
        <div class="mb-4">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label class="form-label text-muted extra-small fw-bold text-uppercase mb-0">Password</label>
          </div>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-key-fill"></i></span>
            <input [type]="showPassword ? 'text' : 'password'" 
                   class="form-control bg-light border-start-0 border-end-0 ps-0 py-2.5 shadow-none" 
                   [(ngModel)]="password" name="password" 
                   placeholder="••••••••" required />
            <button class="btn btn-outline-secondary border-start-0 bg-light text-muted" type="button" (click)="togglePasswordVisibility()">
              <i class="bi" [class.bi-eye-fill]="!showPassword" [class.bi-eye-slash-fill]="showPassword"></i>
            </button>
          </div>
        </div>

        <!-- Sign In Button -->
        <button type="submit" class="btn btn-primary w-100 py-3 fw-bold rounded-3 shadow-sm mb-3 text-uppercase"
                [disabled]="loading">
          @if (loading) {
            <span class="spinner-border spinner-border-sm me-2"></span> Authenticating...
          } @else {
            Sign In <i class="bi bi-arrow-right ms-1"></i>
          }
        </button>
      </form>

      <!-- Prominent Create Account Link -->
      <div class="text-center bg-light p-3 rounded-3 border mb-3">
        <span class="text-muted small me-1">Don't have an account?</span>
        <a [routerLink]="['/register']" class="fw-bold text-primary text-decoration-none">
          Create Account <i class="bi bi-person-plus-fill ms-1"></i>
        </a>
        <div class="extra-small text-muted mt-1">
          <i class="bi bi-shield-check text-warning me-1"></i>New accounts require Admin approval to activate.
        </div>
      </div>

      <!-- Quick 1-Click Demo Login Shortcuts -->
      <div class="border-top pt-3">
        <div class="text-center text-muted extra-small mb-2 fw-bold text-uppercase">1-Click Demo Sign In:</div>
        <div class="d-flex justify-content-center gap-2">
          <button type="button" class="btn btn-xs btn-outline-primary rounded-pill px-3 py-1.5 fw-medium" (click)="quickLogin('admin')">
            <i class="bi bi-shield-lock-fill me-1"></i> Admin
          </button>
          <button type="button" class="btn btn-xs btn-outline-info rounded-pill px-3 py-1.5 fw-medium" (click)="quickLogin('teacher')">
            <i class="bi bi-person-badge-fill me-1"></i> Teacher
          </button>
          <button type="button" class="btn btn-xs btn-outline-success rounded-pill px-3 py-1.5 fw-medium" (click)="quickLogin('student')">
            <i class="bi bi-backpack-fill me-1"></i> Student
          </button>
        </div>
      </div>

    </div>
  </div>
</div>
